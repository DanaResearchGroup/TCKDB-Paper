# Versions this repository builds and tests against. The TCKDB source itself is the `tckdb/` submodule.

[tckdb]
repository = "https://github.com/TCKDB/TCKDB.git"
commit = "67a812c7dec5cf2a10fc48955fa92bf71895d4f4"
tag = "v0.4.0"
image = "laxzal/tckdb-api:sha-67a812c7dec5cf2a10fc48955fa92bf71895d4f4"
image_digest = "sha256:519a48331a634ea244a9b7346be3500faee086dd80487873f516ed8ec4cfdfba"
image_version_tag = "laxzal/tckdb-api:0.4.0"
image_version_tag_digest = "sha256:519a48331a634ea244a9b7346be3500faee086dd80487873f516ed8ec4cfdfba"

# Package versions declared by the pinned TCKDB commit.
[tckdb.packages]
tckdb-client = "0.211.0"
tckdb-schemas = "0.177.3"

# The CHEMKIN and QCSchema adapters (snapshot build and unit tests) and the ARC adapter (the build's ARC source).
# Its packages declare tckdb-client >=0.210,<0.211; they are imported from source beside the submodule's 0.211.0,
# which adds to 0.210 and changes nothing in it.
[tckdb_adapters]
repository = "https://github.com/calvinp0/tckdb-adapters.git"
commit = "bf2d37cefe557d0965ab25521ab00813a15fe8da"
tckdb-arc = "0.15.21"
tckdb-chemkin = "0.7.9"
tckdb-core = "0.5.20"
tckdb-qcschema = "0.9.11"

[arc]
repository = "https://github.com/ReactionMechanismGenerator/ARC.git"
commit = "a7c2666b19a9c0fa36309874bf9ddd55ff53ecd3"

[environment]
cantera = "3.2.0"
postgres_image = "informaticsmatters/rdkit-cartridge-debian:Release_2025_03_3@sha256:96c34a5b88d0cbe02bf57290531f27f3cb97f5d3e494f03baea75ea99749b5ef"
