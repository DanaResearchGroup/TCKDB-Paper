name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_build:
        description: "Run the full snapshot build (needs a self-hosted runner holding the four source trees)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests against the pinned TCKDB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: informaticsmatters/rdkit-cartridge-debian:Release_2025_03_3
        env:
          POSTGRES_USER: tckdb
          POSTGRES_PASSWORD: tckdb
          POSTGRES_DB: tckdb_ci
          LANG: C.UTF-8
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tckdb -d tckdb_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USER: tckdb
      DB_PASSWORD: tckdb
      DB_NAME: tckdb_ci
      DB_CLIENT_ENCODING: utf8
      DB_TEST_NAME: tckdb_test_paper_${{ github.run_id }}_${{ github.run_attempt }}
      TCKDB_TEST_WORKERS: "2"
      RATE_LIMIT_ENABLED: "false"

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out repository and the pinned TCKDB
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          use-mamba: true
          environment-file: tckdb/backend/environment.yml
          activate-environment: tckdb_env
          auto-activate-base: false

      - name: Install the pinned TCKDB packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e tckdb/schemas/python/tckdb-schemas
          python -m pip install -e "tckdb/backend[dev]"
          python -m pip install -e tckdb/clients/python

      - name: Unit tests
        run: python -m pytest tests -n 2 -q

  full-build:
    name: Full snapshot build (self-hosted runner only)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_build }}
    runs-on: [self-hosted, snapshot-sources]
    timeout-minutes: 600

    steps:
      - name: Check out repository and the pinned TCKDB
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The build needs the E2 tree, the ARC run folders and the Arkane directory, which are not in this repository.
      # See snapshot/README.md; this job is a placeholder until a runner holds them.
      - name: Build
        run: |
          echo "Run snapshot/build.py as described in snapshot/README.md on a machine holding the source trees."
          exit 1
