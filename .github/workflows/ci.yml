name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests against the pinned TCKDB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: informaticsmatters/rdkit-cartridge-debian:Release_2025_03_3@sha256:96c34a5b88d0cbe02bf57290531f27f3cb97f5d3e494f03baea75ea99749b5ef
        env:
          POSTGRES_USER: tckdb
          POSTGRES_PASSWORD: tckdb
          POSTGRES_DB: tckdb_ci
          LANG: C.UTF-8
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tckdb -d tckdb_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USER: tckdb
      DB_PASSWORD: tckdb
      DB_NAME: tckdb_ci
      DB_CLIENT_ENCODING: utf8
      DB_TEST_NAME: tckdb_test_paper_${{ github.run_id }}_${{ github.run_attempt }}
      TCKDB_TEST_WORKERS: "2"
      RATE_LIMIT_ENABLED: "false"

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out repository and the pinned TCKDB
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check out the pinned tckdb-adapters
        run: |
          commit=$(python3 -c 'import tomllib; print(tomllib.load(open("pins.toml", "rb"))["tckdb_adapters"]["commit"])')
          git clone --quiet https://github.com/calvinp0/tckdb-adapters.git "$RUNNER_TEMP/tckdb-adapters"
          git -C "$RUNNER_TEMP/tckdb-adapters" checkout --quiet "$commit"
          echo "TCKDB_ADAPTERS_ROOT=$RUNNER_TEMP/tckdb-adapters" >> "$GITHUB_ENV"

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          use-mamba: true
          environment-file: tckdb/backend/environment.yml
          # TCKDB's test fixtures migrate with `conda run -n tckdb_env`, so the env carries that name here.
          activate-environment: tckdb_env
          auto-activate-base: false

      - name: Install the pinned TCKDB packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e tckdb/schemas/python/tckdb-schemas
          python -m pip install -e "tckdb/backend[dev]"
          python -m pip install -e tckdb/clients/python

      - name: Unit tests
        run: python -m pytest tests -n 2 -q
